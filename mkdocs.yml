  - About: about.md
  - Course Description: course-description.md

  - Chapters:
      - List of Chapters: chapters/index.md
      - 1. Core Concepts of Large Language Models: chapters/01-core-concepts-llms/index.md
      - 2. Prompting, Deployment, and Model Optimization Basics: chapters/02-prompting-deployment-optimization/index.md
      - 3. Tokenization and Token Pricing Fundamentals: chapters/03-tokenization-pricing-fundamentals/index.md
      - 4. Managing and Benchmarking Token Consumption: chapters/04-managing-benchmarking-tokens/index.md
      - 5. Compute Pricing and Scaling Fundamentals: chapters/05-compute-pricing-scaling/index.md
      - 6. Infrastructure Planning and Cost Monitoring: chapters/06-infrastructure-planning-monitoring/index.md
      - 7. Prompt, Routing, and Retrieval Efficiency Techniques: chapters/07-prompt-routing-retrieval-efficiency/index.md
      - 8. Model Compression, Testing, and Continuous Efficiency: chapters/08-model-compression-testing-efficiency/index.md
      - 9. Core Financial and ROI Vocabulary: chapters/09-core-financial-roi-vocabulary/index.md
      - 10. Business Case Development and Financial Forecasting: chapters/10-business-case-financial-forecasting/index.md
      - 11. Productivity and Quality Metrics for GenAI: chapters/11-productivity-quality-metrics/index.md
      - 12. Measurement Rigor and KPI Reporting: chapters/12-measurement-rigor-kpi-reporting/index.md
      - 13. Telemetry, Logging, and Cost Dashboards: chapters/13-telemetry-logging-cost-dashboards/index.md
      - 14. Cost Attribution, Governance, and Observability Maturity: chapters/14-cost-attribution-observability-maturity/index.md
      - 15. AI-Assisted Coding Across the SDLC: chapters/15-ai-assisted-coding-sdlc/index.md
      - 16. SDLC Productivity, Risk, and Cost Roadmapping: chapters/16-sdlc-productivity-risk-roadmapping/index.md
      - 17. Data and Model Lifecycle Cost Drivers: chapters/17-data-model-lifecycle-cost-drivers/index.md
      - 18. MLOps Infrastructure and Reuse Economics: chapters/18-mlops-infrastructure-reuse-economics/index.md
      - 19. Vendor Pricing and Licensing Economics: chapters/19-vendor-pricing-licensing-economics/index.md
      - 20. Vendor Selection and Sourcing Strategy: chapters/20-vendor-selection-sourcing-strategy/index.md
      - 21. Governance, Compliance, and Security Risk: chapters/21-governance-compliance-security-risk/index.md
      - 22. Risk-Adjusted Costing and Executive Risk Reporting: chapters/22-risk-adjusted-costing-reporting/index.md
      - 23. Audience Analysis and Executive Framing: chapters/23-audience-analysis-executive-framing/index.md
      - 24. Presenting and Defending Findings to Executives: chapters/24-presenting-defending-findings/index.md
      - 25. Designing the Executive ROI Report: chapters/25-designing-executive-roi-report/index.md
      - 26. Data Visualization and Storytelling for Financial Audiences: chapters/26-data-visualization-storytelling/index.md
      - 27. Report Production, Review, and the Capstone Project: chapters/27-report-production-review-capstone/index.md

  - Learning Graph:
      - Introduction: learning-graph/index.md
      - Course Description Assessment: learning-graph/course-description-assessment.md
      - Concept Enumeration: learning-graph/concept-list.md
      - Concept Taxonomy: learning-graph/concept-taxonomy.md
      - Graph Quality Analysis: learning-graph/quality-metrics.md
      - Taxonomy Distribution: learning-graph/taxonomy-distribution.md

  - MicroSims:
      - List of MicroSims: sims/index.md
      - Learning Graph Viewer: sims/graph-viewer/index.md

  - License: license.md
  - Contact: contact.md

# Theme configuration
theme:
  name: material
  # Once a logo is generated, point this at docs/img/logo.png or a mascot pose:
  # logo: img/logo.png
  # favicon: img/favicon.ico
  palette:
    primary: 'indigo'
    accent: 'orange'
  include_sidebar: true
  features:
    - content.code.copy
    - content.action.edit
    - navigation.expand
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share

# Plugins
plugins:
  - search
  # Uncomment after running `pip install "mkdocs-material[imaging]"`:
  # - social
  # Uncomment after running `pip install mkdocs-glightbox`:
  # - glightbox:
  #     touchNavigation: true
  #     loop: false
  #     effect: zoom
  #     slide_effect: slide
  #     width: 100%
  #     height: auto
  #     zoomable: true
  #     draggable: true
  #     auto_caption: false
  #     caption_position: bottom
  #     skip_classes:
  #       - mascot-admonition-img   # keep mascot poses out of the lightbox gallery

# Markdown extensions
markdown_extensions:
  - md_in_html
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true

# Custom CSS — file is created by init-textbook
extra_css:
  - css/extra.css

# Custom JavaScript — uncomment once a corresponding file exists
# extra_javascript:
#   - js/extra.js

# Exclude prompt scratch files and TODOs from build/search/sitemap
exclude_docs: |
  **/image-prompt*.md
  **/image-prompts*.md
  **/cover-prompt.md
  **/TODO.md

# Rebuild on changes during `mkdocs serve`
watch:
  - docs
  - mkdocs.yml

# Extra
extra:
  # Suppress the "Made with Material for MkDocs" footer line
  generator: false

  # MicroSim build-status indicators shown next to nav entries.
  # The status value is set per-page in the index.md frontmatter:
  #   status: scaffold | built | approved
  # Colors are defined as CSS custom properties in docs/css/extra.css.
  # Note: `theme.icon.status` is a Material Insiders feature and is silently
  # ignored on community Material. Do not add it — the CSS-variable approach
  # in extra.css is the load-bearing piece on the community edition.
  status:
    scaffold: Scaffold — placeholder, not yet implemented
    built: Built — implementation complete, awaiting review
    approved: Approved — tested and approved

  # Intelligent-textbook URI scheme (see
  # https://dmccreary.github.io/intelligent-textbooks/uri-scheme/)
  schema: https://dmccreary.github.io/intelligent-textbooks/ns/textbook/v1
  textbook_name: 'Measuring GenAI ROI'
  textbook_version: '0.1'

  # Google Analytics — uncomment once a property ID exists:
  # analytics:
  #   provider: google
  #   property: G-XXXXXXXXXX
